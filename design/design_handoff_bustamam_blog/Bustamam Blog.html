<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bustamam Technology — Blog directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Space+Grotesk:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#f0eee9; }
  body { font-family: 'Geist', -apple-system, system-ui, sans-serif; }
  .artboard-scroll { overflow:auto; }
  .artboard-scroll::-webkit-scrollbar { width:0; height:0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared-data.jsx"></script>
<script type="text/babel" src="direction-a.jsx"></script>
<script type="text/babel" src="direction-b.jsx"></script>
<script type="text/babel" src="direction-a-v2.jsx"></script>
<script type="text/babel" src="direction-c.jsx"></script>

<script type="text/babel">
  function App() {
    return (
      <DesignCanvas>
        <DCSection id="dir-a-v2" title="Direction A · v2 — Polished Terminal (solo practice)" subtitle="Refined terminal aesthetic, tuned for a one-person consultancy. Availability chip, 'now' strip, author bio card.">
          <DCArtboard id="av2-index-light" label="Index · Light" width={1280} height={1640}>
            <DirectionA2Index theme="light" />
          </DCArtboard>
          <DCArtboard id="av2-index-dark" label="Index · Dark" width={1280} height={1640}>
            <DirectionA2Index theme="dark" />
          </DCArtboard>
        </DCSection>

        <DCSection id="dir-c" title="Direction C — Hybrid (terminal bones + editorial type + orbital)" subtitle="A v2's structure and terminal chrome, B's Instrument Serif display type and small orbital accent. Warmer paper, same engineer credibility.">
          <DCArtboard id="c-index-light" label="Index · Light" width={1280} height={1720}>
            <DirectionCIndex theme="light" />
          </DCArtboard>
          <DCArtboard id="c-index-dark" label="Index · Dark" width={1280} height={1720}>
            <DirectionCIndex theme="dark" />
          </DCArtboard>
        </DCSection>

        <DCSection id="dir-a" title="Direction A · v1 — Original Terminal" subtitle="For reference. Now updated with solo-consultancy copy.">
          <DCArtboard id="a-index-light" label="Index · Light" width={1280} height={900}>
            <DirectionAIndex theme="light" />
          </DCArtboard>
          <DCArtboard id="a-index-dark" label="Index · Dark" width={1280} height={900}>
            <DirectionAIndex theme="dark" />
          </DCArtboard>
          <DCArtboard id="a-post-light" label="Post · Light" width={1280} height={1400}>
            <DirectionAPost theme="light" />
          </DCArtboard>
          <DCArtboard id="a-post-dark" label="Post · Dark" width={1280} height={1400}>
            <DirectionAPost theme="dark" />
          </DCArtboard>
        </DCSection>

        <DCSection id="dir-b" title="Direction B — Swiss Editorial (reference)" subtitle="For comparison.">
          <DCArtboard id="b-index-light" label="Index · Light" width={1280} height={900}>
            <DirectionBIndex theme="light" />
          </DCArtboard>
          <DCArtboard id="b-index-dark" label="Index · Dark" width={1280} height={900}>
            <DirectionBIndex theme="dark" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
