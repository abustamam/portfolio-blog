name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        # Build west of UTC so tests/post-dates.spec.ts catches dates that are
        # formatted in local time (they render a day early here, not on UTC).
        env:
          TZ: America/Los_Angeles

      - name: Check internal links in dist
        run: node scripts/check-links.mjs dist

      - name: Test the quiz intake service
        run: bun test services/ai-quiz-intake

      # Includes the scrub.ps1 / scrub.py parity test: ubuntu-latest has pwsh,
      # and with CI set a missing pwsh fails the run instead of skipping.
      - name: Test the log-analysis kit
        run: bun test kits/log-analysis

      - name: Test the data-analysis kit
        run: bun test kits/data-analysis

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Run tests
        run: bun run test