# Legacy host: everything on blog.bustamam.tech moves to the apex, path and
# query preserved. The upstream proxy must forward the original Host header.
server {
    listen 80;
    server_name blog.bustamam.tech;
    return 301 https://bustamam.tech$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed files if available
    gzip_static on;

    # Emit relative Location headers. nginx sits behind Caddy on plain http, so
    # an absolute redirect (e.g. the /ai-quiz -> /ai-quiz/ directory slash)
    # would say http:// and cost an extra hop back to https.
    absolute_redirect off;

    # Old portfolio routes -> case studies
    location ~ ^/(services|projects)/?$ {
        return 301 /work/;
    }

    # Retired case-study URLs
    location ~ ^/work/cdk-global/?$ {
        return 301 /work/salty/;
    }
    location ~ ^/work/embedded-insurance/?$ {
        return 301 /work/salty-ai/;
    }

    # Legacy /blog/<slug> -> /writing/<slug>/ (Astro static builds cannot do this)
    location ~ ^/blog/(?<slug>[^/]+)/?$ {
        return 301 /writing/$slug/;
    }

    # Generated social cards are not content-hashed: revalidate daily
    location ^~ /og/ {
        expires 1d;
        try_files $uri =404;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA-style fallback (handles Astro's trailing slash routing)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404
    error_page 404 /404.html;
}
